<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a2e"/>
  
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="40" height="30" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 30" fill="none" stroke="#16213e" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold">NSE Stock Data Scraper</text>
  
  <!-- Chart container -->
  <rect x="50" y="60" width="300" height="180" fill="#0f3460" stroke="#16213e" stroke-width="2" rx="5"/>
  
  <!-- Stock price line chart -->
  <polyline points="70,200 90,180 110,190 130,160 150,170 170,140 190,150 210,120 230,130 250,100 270,110 290,90 310,100 330,80" 
            fill="none" stroke="#00d4ff" stroke-width="3"/>
  
  <!-- Volume bars -->
  <rect x="70" y="220" width="8" height="15" fill="#667eea" opacity="0.7"/>
  <rect x="90" y="215" width="8" height="20" fill="#667eea" opacity="0.7"/>
  <rect x="110" y="225" width="8" height="10" fill="#667eea" opacity="0.7"/>
  <rect x="130" y="210" width="8" height="25" fill="#667eea" opacity="0.7"/>
  <rect x="150" y="218" width="8" height="17" fill="#667eea" opacity="0.7"/>
  <rect x="170" y="205" width="8" height="30" fill="#667eea" opacity="0.7"/>
  <rect x="190" y="220" width="8" height="15" fill="#667eea" opacity="0.7"/>
  <rect x="210" y="200" width="8" height="35" fill="#667eea" opacity="0.7"/>
  <rect x="230" y="215" width="8" height="20" fill="#667eea" opacity="0.7"/>
  <rect x="250" y="195" width="8" height="40" fill="#667eea" opacity="0.7"/>
  <rect x="270" y="210" width="8" height="25" fill="#667eea" opacity="0.7"/>
  <rect x="290" y="205" width="8" height="30" fill="#667eea" opacity="0.7"/>
  <rect x="310" y="218" width="8" height="17" fill="#667eea" opacity="0.7"/>
  <rect x="330" y="212" width="8" height="23" fill="#667eea" opacity="0.7"/>
  
  <!-- Data points -->
  <circle cx="70" cy="200" r="3" fill="#00d4ff"/>
  <circle cx="90" cy="180" r="3" fill="#00d4ff"/>
  <circle cx="110" cy="190" r="3" fill="#00d4ff"/>
  <circle cx="130" cy="160" r="3" fill="#00d4ff"/>
  <circle cx="150" cy="170" r="3" fill="#00d4ff"/>
  <circle cx="170" cy="140" r="3" fill="#00d4ff"/>
  <circle cx="190" cy="150" r="3" fill="#00d4ff"/>
  <circle cx="210" cy="120" r="3" fill="#00d4ff"/>
  <circle cx="230" cy="130" r="3" fill="#00d4ff"/>
  <circle cx="250" cy="100" r="3" fill="#00d4ff"/>
  <circle cx="270" cy="110" r="3" fill="#00d4ff"/>
  <circle cx="290" cy="90" r="3" fill="#00d4ff"/>
  <circle cx="310" cy="100" r="3" fill="#00d4ff"/>
  <circle cx="330" cy="80" r="3" fill="#00d4ff"/>
  
  <!-- Legend -->
  <rect x="60" y="250" width="280" height="40" fill="#16213e" stroke="#00d4ff" stroke-width="1" rx="3"/>
  <line x1="80" y1="265" x2="100" y2="265" stroke="#00d4ff" stroke-width="2"/>
  <text x="110" y="269" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Stock Price</text>
  <rect x="200" y="262" width="12" height="6" fill="#667eea"/>
  <text x="220" y="269" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Volume</text>
  
  <!-- API indicator -->
  <circle cx="360" cy="70" r="4" fill="#00ff88"/>
  <text x="350" y="85" fill="#00ff88" font-family="Arial, sans-serif" font-size="10">API</text>
  
  <!-- Download icon -->
  <path d="M 370 250 L 370 240 M 375 245 L 370 250 L 365 245 M 360 255 L 380 255" 
        stroke="#f093fb" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="355" y="275" fill="#f093fb" font-family="Arial, sans-serif" font-size="10">CSV Export</text>
</svg>